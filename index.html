<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow app column on charcoal, like Marshall's business card. Cream is the only accent; the MB monogram anchors the header and the booking page. Single dark look by design. */
:root {
  --bg: #1A1A1A;
  --surface: #212120;
  --surface-2: #292927;
  --ink: #FFFDE8;
  --muted: #A9A694;
  --line: #3A3934;
  --accent: #FFFDE8;
  --accent-ink: #1A1A1A;
  --accent-soft: rgba(255, 253, 232, .09);
  --pole: #E57A6C;
  --pole-soft: rgba(229, 122, 108, .15);
  --good: #A9D29B;
  --good-soft: rgba(169, 210, 155, .13);
  --shadow: 0 16px 40px rgba(0, 0, 0, .55);
  --display: "Instrument Serif", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding-block: 12px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 12px; }
.mark { height: 34px; width: auto; flex: none; display: block; }
.brand h1 { font-family: var(--body); font-weight: 500; font-size: 14px; letter-spacing: .18em; line-height: 1.2; margin: 0; text-transform: uppercase; }
.brand .sub { font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }
.tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.tabs button { background: none; border: 0; padding: 10px 12px 11px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { max-width: 760px; margin: 0 auto; padding-block: 18px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }

/* Generic bits */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--pole); }
.btn.danger.solid { background: var(--pole); border-color: var(--pole); color: #fff; }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
h2 { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .01em; margin: 0; text-transform: uppercase; line-height: 1.05; text-wrap: balance; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: .02em; white-space: nowrap; }
.pill.free { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--line); }
.pill.booked { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.noshow { background: var(--pole-soft); color: var(--pole); }
.pill.block { background: var(--surface-2); color: var(--muted); }
.pill.visit { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
.notice { padding: 14px 16px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); font-size: 14px; }

/* Next up */
.next { padding: 16px; display: grid; gap: 10px; border-left: 4px solid var(--accent); }
.next .who { font-size: 20px; font-weight: 700; }
.next .when { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; }

/* Diary */
.day { overflow: hidden; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.day-head .d { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
.day-head .d small { font-family: var(--body); font-size: 12px; font-weight: 700; color: var(--accent); margin-left: 8px; letter-spacing: .06em; }
.slot { width: 100%; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
.slot:last-child { border-bottom: 0; }
.slot:hover { background: var(--surface-2); }
.slot .t { font-weight: 700; font-variant-numeric: tabular-nums; }
.slot .info { min-width: 0; }
.slot .info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .info span { font-size: 13px; color: var(--muted); }
.slot .end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.slot .price { font-weight: 700; font-variant-numeric: tabular-nums; }

.travel { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 7px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); font-size: 13px; color: var(--muted); }
.travel .t { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.travel.tight { color: var(--pole); }
.plan { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 14px; }
.warn { color: var(--pole); font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Clients */
.search { width: 100%; padding: 11px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.client { width: 100%; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
.client:last-child { border-bottom: 0; }
.client:hover { background: var(--surface-2); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.client .info { min-width: 0; }
.client .info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Takings */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { padding: 14px; }
.tile .v { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.chart { padding: 16px; }
.bars { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; align-items: end; height: 170px; margin-top: 14px; border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.bar .fill { width: 100%; max-width: 40px; background: var(--accent); border-radius: 6px 6px 0 0; min-height: 2px; opacity: .85; }
.bar.cur .fill { opacity: 1; }
.bar .lbl { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.xl { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.xl span { font-size: 11px; color: var(--muted); text-align: center; }
table.months { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.months td, table.months th { padding: 10px 16px; border-bottom: 1px solid var(--line); text-align: left; }
table.months th { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
table.months td:last-child, table.months th:last-child { text-align: right; }

/* Client booking page */
.hero { padding: 40px 20px 32px; display: grid; gap: 14px; justify-items: center; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); position: relative; overflow: hidden; isolation: isolate; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -2; background: var(--hero-img) var(--hero-pos, center) / cover no-repeat; filter: grayscale(var(--hero-grey, .4)) brightness(var(--hero-bright, .82)) contrast(1.05); opacity: var(--hero-op, .56); }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background:
  radial-gradient(ellipse 62% 52% at 50% 46%, rgba(26, 26, 26, .62), rgba(26, 26, 26, .22) 70%, rgba(26, 26, 26, 0) 100%),
  linear-gradient(180deg, var(--surface) 0%, rgba(33, 33, 32, 0) 18%, rgba(33, 33, 32, 0) 86%, var(--surface) 100%); }
.hero p { color: #E4E1CC; text-shadow: 0 1px 12px rgba(0, 0, 0, .6); }
.hero h2, .hero .tag { text-shadow: 0 1px 12px rgba(0, 0, 0, .6); }
.hero .mono { width: min(200px, 60%); height: auto; }
.hero h2 { font-size: 40px; }
.hero p { margin: 0; max-width: 40ch; }
.hero .tag { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #E4E1CC; }
.board { padding: 6px 16px; }
.board .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px dotted var(--line); }
.board .item:last-child { border-bottom: 0; }
.board .item b { font-size: 16px; }
.board .item .p { color: var(--ink); align-self: center; font-family: var(--display); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }
.board .item span:not(.p) { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.step { padding: 16px; display: grid; gap: 12px; }
.step h3 { margin: 0; font-size: 15px; display: flex; gap: 10px; align-items: center; }
.step h3 .n { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 13px; }
.choices { display: flex; gap: 8px; flex-wrap: wrap; }
.choice { border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; border-radius: 10px; font-weight: 600; text-align: left; }
.choice small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.choice.soon { border-style: dashed; color: var(--muted); background: transparent; cursor: default; }
.choice.soon small { color: var(--ink); letter-spacing: .08em; text-transform: uppercase; font-size: 10.5px; font-weight: 600; }
.choices.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice.big { padding: 16px; font-size: 17px; }
.choice.big small { font-size: 12.5px; margin-top: 4px; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 12px; border-top: 1px dotted var(--line); font-size: 14px; color: var(--muted); }
.total b { font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--ink); }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.request { padding: 16px; display: grid; gap: 12px; border: 2px solid var(--accent); }
.msg { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); padding: 12px; border-radius: 10px; font-size: 14px; }

/* Forms + sheets */
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.field textarea { min-height: 76px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(5, 15, 18, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; box-shadow: var(--shadow); padding-block: 18px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; animation: up .18s ease-out; }
@media (min-width: 700px) { .backdrop { align-items: center; } .sheet { border-radius: 18px; } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.err { color: var(--pole); font-size: 13.5px; font-weight: 600; }
.hist { display: grid; gap: 0; }
.hist div { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.hist div:last-child { border-bottom: 0; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 30; font-size: 14px; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); }
@media (max-width: 480px) {
  .tiles { grid-template-columns: 1fr 1fr; }
  .tiles .tile:first-child { grid-column: 1 / -1; }
  .hero h2 { font-size: 38px; }
  .grid2 { grid-template-columns: 1fr; }
}
/* Instrument Serif has one weight: keep display text at 400, set large and spaced like the card */
h2, .next .when, .day-head .d, .tile .v, .board .item .p { font-weight: 400; }
h2 { font-size: 30px; letter-spacing: .02em; }
.day-head .d { font-size: 24px; }
.next .when { font-size: 36px; }
.tile .v { font-size: 34px; }
.board .item .p { font-size: 26px; }
.eyebrow { letter-spacing: .16em; }

/* Swipeable hero slides */
.slides { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; border-radius: var(--r); }
.slides::-webkit-scrollbar { display: none; }
.slides .hero { scroll-snap-align: center; scroll-snap-stop: always; align-content: center; min-height: 100%; }

<script>
// ---------- Settings Marshall can change ----------
const MARSH_PHONE = "07711563229"; // e.g. "07123456789" — fills the WhatsApp / text buttons on the booking page
const SLOT_DAYS = [4, 5]; // Thursday, Friday
const SLOT_TIMES = ["19:45", "20:30", "21:15"];
const SERVICES = {
  trim: { name: "Cut", price: 25 },
  hairbeard: { name: "Hair & beard", price: 35 },
  colour: { name: "Colour & dye", price: 90, from: true },
};
const VISIT_FROM = 35;
const VISIT_DAYS = [0, 1, 2, 3, 6]; // every day except Thursday and Friday (home studio days)
const WED_VISIT_TIMES = ["14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00"]; // Wednesday is a day off
const EVE_VISIT_TIMES = ["19:30", "20:00", "20:30", "21:00"]; // after the shop closes at 7pm
const visitTimesFor = date => date && parseYmd(date).getDay() === 3 ? WED_VISIT_TIMES : EVE_VISIT_TIMES;
const VISIT_TIMES = WED_VISIT_TIMES;
const COLOUR_LATEST_START = "15:00"; // colour blocks 4 hours, so it starts early
const DURATION = { trim: 50, hairbeard: 75, colour: 240 }; // minutes
const TRAVEL_DEFAULT = 20; // minutes between visits, before checking live traffic
const HOME_BASE = "Urmston, Manchester M41";
const STYLES = [["skinfade", "Skin fade"], ["taper", "Taper"], ["mullet", "Mullet"], ["mod", "Mod"], ["slickback", "Slick back"], ["refresh", "Refresh"]];
const REFRESH_EXTRA = 5;

// ---------- Helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DAYS_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MON_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const fmtDate = s => { const d = parseYmd(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtDateLong = s => { const d = parseYmd(s); return `${DAYS_LONG[d.getDay()]} ${d.getDate()} ${MON_LONG[d.getMonth()]}`; };
const fmtTime = t => { if (!t) return ""; const [h, m] = t.split(":").map(Number); const hh = ((h + 11) % 12) + 1; return `${hh}:${pad(m)}${h < 12 ? "am" : "pm"}`; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayStr = () => ymd(new Date());
const money = n => "£" + (Math.round(Number(n || 0) * 100) / 100).toLocaleString("en-GB", { minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2 });
const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const slotId = (date, time) => `s_${date}_${time.replace(":", "")}`;
const isSlot = (date, time) => SLOT_DAYS.includes(parseYmd(date).getDay()) && SLOT_TIMES.includes(time);
const firstName = n => String(n || "").trim().split(/\s+/)[0] || "mate";
const initials = n => String(n || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const svcName = b => b.service === "trim" ? (b.where === "visit" ? "Home cut" : "Studio cut") : (SERVICES[b.service] || { name: "Cut" }).name + (b.where === "visit" && b.service === "hairbeard" ? " (home)" : "");
const styleName = k => (STYLES.find(x => x[0] === k) || [])[1] || "";
const svcPhrase = (k, where) => k === "colour" ? "colour and dye" : k === "hairbeard" ? "a hair and beard" : where === "visit" ? "a home cut" : where === "home" ? "a studio cut" : "a haircut";
const amount = b => Number(b.paid ?? b.price ?? 0) + Number(b.tip || 0);
const waNumber = p => { let d = String(p || "").replace(/\D/g, ""); if (d.startsWith("0")) d = "44" + d.slice(1); return d; };
const waLink = (p, text) => `https://wa.me/${waNumber(p)}?text=${encodeURIComponent(text)}`;
const smsLink = (p, text) => `sms:${String(p || "").replace(/[^\d+]/g, "")}?&body=${encodeURIComponent(text)}`;
const when = b => b.date + "T" + (b.time || "00:00");

const toMin = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return h * 60 + m; };
const fromMin = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const durOf = b => Number(b.duration ?? DURATION[b.service] ?? 50);
const endTime = b => fromMin(toMin(b.time) + durOf(b));
const durText = m => m >= 240 ? "at least 4 hours" : m >= 60 ? `about ${Math.floor(m / 60)} hr${m % 60 ? ` ${m % 60} min` : ""}` : `about ${m} min`;
const mapsLink = (from, to) => `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(from)}&destination=${encodeURIComponent(to)}&travelmode=driving`;
const wazeLink = to => `https://waze.com/ul?q=${encodeURIComponent(to)}&navigate=yes`;
function upcomingDays(days, weekdays) {
  const out = []; const t = new Date(); t.setHours(0, 0, 0, 0);
  for (let i = 0; i < days; i++) { const d = addDays(t, i); if (weekdays.includes(d.getDay())) out.push(ymd(d)); }
  return out;
}
function upcomingSlotDates(days) {
  const out = []; const t = new Date(); t.setHours(0, 0, 0, 0);
  for (let i = 0; i < days; i++) { const d = addDays(t, i); if (SLOT_DAYS.includes(d.getDay())) out.push(ymd(d)); }
  return out;
}

function toast(msg) {
  const r = $("#toast-root"); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => (r.innerHTML = ""), 1800);
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { if (fallbackEl) { const range = document.createRange(); range.selectNodeContents(fallbackEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); } toast("Text selected, copy it now"); }
}

// ---------- State ----------
const S = {
  owner: false, db: null, ready: false, failed: false,
  view: "book", range: "upcoming",
  bookings: new Map(), clients: new Map(),
  search: "", slide: 0,
  cv: { mode: "visit", service: "trim", style: "", date: null, time: null, vdate: "", vtime: "", area: "", access: "", name: "", phone: "", notes: "", sent: false, error: "" },
};

// ---------- Messages ----------
function dayWord(date) {
  const t = todayStr(), tm = ymd(addDays(new Date(), 1));
  return date === t ? "today" : date === tm ? "tomorrow" : `on ${fmtDateLong(date)}`;
}
function confirmText(b) {
  const svc = svcPhrase(b.service, b.where);
  if (b.where === "visit") return `Hi ${firstName(b.clientName)}, your home visit with Marsh Barbers is booked for ${fmtDateLong(b.date)} at ${fmtTime(b.time)} for ${svc}, ${money(b.price)}.${b.address ? ` I'll come to ${b.address}.` : ""} Any problems, just message me. Marshall`;
  return `Hi ${firstName(b.clientName)}, you're booked in with Marsh Barbers on ${fmtDateLong(b.date)} at ${fmtTime(b.time)} for ${svc} (${money(b.price)}). I'll send the address over before. Any problems, just message me. Marshall`;
}
function reminderText(b) {
  const svc = svcPhrase(b.service, b.where);
  if (b.where === "visit") return `Hi ${firstName(b.clientName)}, just a reminder I'm coming to you ${dayWord(b.date)} at ${fmtTime(b.time)} for ${svc}. See you then. Marshall`;
  return `Hi ${firstName(b.clientName)}, just a reminder you're booked in ${dayWord(b.date)} at ${fmtTime(b.time)} for ${svc}. See you then. Marshall`;
}

// ---------- Render root ----------
function render() {

  $("#brand-sub").textContent = S.owner ? "Creative Barber · your diary" : "Creative Barber · Urmston";
  const app = $("#app");
  if (S.view === "diary") app.innerHTML = renderDiary();
  else if (S.view === "clients") app.innerHTML = renderClients();
  else if (S.view === "takings") app.innerHTML = renderTakings();
  else app.innerHTML = renderBook();
  const sl = $("#slides");
  if (sl) {
    sl.scrollLeft = S.slide * (sl.clientWidth + 12);
    sl.addEventListener("scroll", () => {
      const i = Math.round(sl.scrollLeft / (sl.clientWidth + 12));
      if (i !== S.slide) { S.slide = i; document.querySelectorAll("#dots button").forEach((b, k) => b.setAttribute("aria-current", String(k === i))); }
    }, { passive: true });
  }
  if (S.view === "clients") { const s = $("#c-search"); if (s && S._focusSearch) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
}

function dataGate() {
  if (S.failed) return `<div class="notice">Your diary couldn't load just now. Refresh the page, and make sure you're signed in to Claude.</div>`;
  if (!S.ready) return `<div class="notice">Loading your diary…</div>`;
  return "";
}

// ---------- Diary ----------
function bookingsOn(date) { return [...S.bookings.values()].filter(b => b.date === date); }
function renderDiary() {
  const gate = dataGate();
  const now = new Date(); const nowKey = ymd(now) + "T" + pad(now.getHours()) + ":" + pad(now.getMinutes());
  const all = [...S.bookings.values()].filter(b => b.kind !== "block");
  const next = all.filter(b => b.status === "booked" && when(b) >= nowKey).sort((a, b) => when(a).localeCompare(when(b)))[0];
  const t = todayStr();
  let dates;
  if (S.range === "upcoming") {
    const set = new Set([...upcomingSlotDates(42), ...upcomingDays(42, [3])]);
    all.forEach(b => { if (b.date >= t) set.add(b.date); });
    dates = [...set].sort();
  } else {
    const set = new Set();
    all.forEach(b => { if (b.date < t) set.add(b.date); });
    dates = [...set].sort().reverse();
  }
  const nextHtml = next ? `
    <section class="panel next" aria-label="Next up">
      <div class="spread"><span class="eyebrow">Next up</span>${next.where === "visit" ? `<span class="pill visit">Home visit</span>` : ""}</div>
      <div class="when">${esc(fmtDate(next.date))} · ${esc(fmtTime(next.time))}</div>
      <div><span class="who">${esc(next.clientName)}</span> <span class="muted">· ${esc(svcName(next))} · ${money(next.price)}</span></div>
      <div class="row">
        <button class="btn small primary" data-action="open-booking" data-id="${esc(next.id)}">Open</button>
        <button class="btn small" data-action="copy-reminder" data-id="${esc(next.id)}">Copy reminder</button>
      </div>
    </section>` : (S.ready ? `<div class="notice">Nothing booked yet. Tap a free slot below to book someone in, or add a home visit.</div>` : "");

  const daysHtml = dates.length ? dates.map(date => renderDay(date)).join("") : `<div class="panel empty">No past appointments yet.</div>`;
  return `
    ${gate}
    ${nextHtml}
    <div class="spread">
      <div class="seg" role="group" aria-label="Show">
        <button data-action="range" data-range="upcoming" aria-pressed="${S.range === "upcoming"}">Upcoming</button>
        <button data-action="range" data-range="past" aria-pressed="${S.range === "past"}">Past</button>
      </div>
      <div class="row">
        <button class="btn small" data-action="new-booking" data-where="visit">+ Home visit</button>
        <button class="btn small primary" data-action="new-booking" data-where="home">+ Booking</button>
      </div>
    </div>
    ${daysHtml}`;
}
function renderDay(date) {
  const items = bookingsOn(date);
  const t = todayStr(), tm = ymd(addDays(new Date(), 1));
  const tag = date === t ? "TODAY" : date === tm ? "TOMORROW" : "";
  const isSlotDay = SLOT_DAYS.includes(parseYmd(date).getDay());
  const rows = [];
  if (isSlotDay) {
    SLOT_TIMES.forEach(time => {
      const b = items.find(x => x.where !== "visit" && x.time === time);
      rows.push({ time, b });
    });
  }
  items.filter(x => x.where === "visit" || !SLOT_TIMES.includes(x.time) || !isSlotDay).forEach(b => {
    if (!rows.some(r => r.b === b)) rows.push({ time: b.time, b });
  });
  rows.sort((a, b) => a.time.localeCompare(b.time));
  const isVisitDay = VISIT_DAYS.includes(parseYmd(date).getDay());
  const isWed = parseYmd(date).getDay() === 3;
  let body = "", prevVisit = null;
  rows.forEach(r => {
    const b = r.b;
    if (b && b.where === "visit" && b.kind !== "block" && b.status !== "noshow") {
      if (prevVisit) {
        const gap = toMin(b.time) - toMin(endTime(prevVisit));
        const need = Number(b.travel ?? TRAVEL_DEFAULT);
        const from = prevVisit.address || HOME_BASE;
        body += `<div class="travel${gap < need ? " tight" : ""}"><span class="t">Drive</span><span class="info"><span>${gap >= 0 ? `${gap} min gap` : `Overlaps by ${-gap} min`}${gap < need ? ` · needs ${need} min` : ""}</span></span><span class="end">${b.address ? `<a class="btn small" href="${esc(mapsLink(from, b.address))}" target="_blank" rel="noopener">Traffic</a>` : ""}</span></div>`;
      }
      prevVisit = b;
    }
    body += renderSlot(date, r.time, b);
  });
  if (isWed && !items.some(b => b.where === "visit")) body += `<button class="slot" data-action="new-visit-on" data-date="${date}"><span class="t muted">2pm</span><span class="info"><b class="muted" style="font-weight:500">Home visits, 2 to 6pm</b><span>Tap to add a visit</span></span><span class="end"><span class="pill free">Free</span></span></button>`;
  else if (isVisitDay) body += `<button class="slot" data-action="new-visit-on" data-date="${date}"><span class="t muted">+</span><span class="info"><span>Add another visit</span></span><span class="end"></span></button>`;
  const live = items.filter(b => b.kind !== "block" && b.status !== "noshow");
  const booked = items.filter(b => b.kind !== "block").length;
  const total = live.reduce((s, b) => s + (b.status === "done" ? amount(b) : Number(b.price || 0)), 0);
  const summary = isSlotDay ? `${items.filter(b => b.kind !== "block" && b.where !== "visit" && SLOT_TIMES.includes(b.time)).length} of ${SLOT_TIMES.length} booked` : `${booked} booked`;
  return `
    <section class="panel day" aria-label="${esc(fmtDateLong(date))}">
      <div class="day-head"><div class="d">${esc(fmtDate(date))}${tag ? `<small>${tag}</small>` : ""}</div><div class="muted num" style="font-size:13px">${summary}${total ? ` · ${money(total)}` : ""}</div></div>
      ${body}
    </section>`;
}
function renderSlot(date, time, b) {
  if (!b) return `<button class="slot" data-action="free-slot" data-date="${date}" data-time="${time}"><span class="t">${fmtTime(time)}</span><span class="info"><b class="muted" style="font-weight:500">Free</b><span>Tap to book or block</span></span><span class="end"><span class="pill free">Free</span></span></button>`;
  if (b.kind === "block") return `<button class="slot" data-action="open-booking" data-id="${esc(b.id)}"><span class="t muted">${fmtTime(time)}</span><span class="info"><b class="muted" style="font-weight:500">Blocked</b><span>${esc(b.reason || "Not taking bookings")}</span></span><span class="end"><span class="pill block">Blocked</span></span></button>`;
  const pill = b.status === "done" ? `<span class="pill done">Done</span>` : b.status === "noshow" ? `<span class="pill noshow">No-show</span>` : b.where === "visit" ? `<span class="pill visit">Home visit</span>` : `<span class="pill booked">Booked</span>`;
  const price = b.status === "done" ? money(amount(b)) : money(b.price);
  return `<button class="slot" data-action="open-booking" data-id="${esc(b.id)}"><span class="t">${fmtTime(time)}</span><span class="info"><b>${esc(b.clientName)}</b><span>${b.where === "visit" ? `until ${fmtTime(endTime(b))} · ` : ""}${esc(svcName(b))}${b.style ? ` · ${esc(styleName(b.style))}` : ""}${b.where === "visit" && b.address ? ` · ${esc(b.address)}` : ""}${b.notes ? ` · ${esc(b.notes)}` : ""}</span></span><span class="end"><span class="price">${price}</span>${pill}</span></button>`;
}

// ---------- Clients ----------
function clientStats(id) {
  const list = [...S.bookings.values()].filter(b => b.clientId === id && b.kind !== "block");
  const done = list.filter(b => b.status === "done").sort((a, b) => when(b).localeCompare(when(a)));
  return { list, done, visits: done.length, spent: done.reduce((s, b) => s + amount(b), 0), last: done[0]?.date || null, noshows: list.filter(b => b.status === "noshow").length, upcoming: list.filter(b => b.status === "booked").sort((a, b) => when(a).localeCompare(when(b))) };
}
function renderClients() {
  const gate = dataGate();
  const q = S.search.trim().toLowerCase();
  const list = [...S.clients.values()].map(c => ({ c, st: clientStats(c.id) }))
    .filter(({ c }) => !q || c.name.toLowerCase().includes(q) || String(c.phone || "").includes(q) || String(c.notes || "").toLowerCase().includes(q))
    .sort((a, b) => (b.st.last || "").localeCompare(a.st.last || "") || a.c.name.localeCompare(b.c.name));
  return `
    ${gate}
    <div class="spread"><h2>Clients <span class="muted num" style="font-size:20px">${S.clients.size}</span></h2><button class="btn small primary" data-action="new-client">+ Client</button></div>
    <input class="search" id="c-search" type="search" placeholder="Search name, number or notes" value="${esc(S.search)}" aria-label="Search clients">
    <section class="panel">
      ${list.length ? list.map(({ c, st }) => `
        <button class="client" data-action="open-client" data-id="${esc(c.id)}">
          <span class="avatar">${esc(initials(c.name))}</span>
          <span class="info"><b>${esc(c.name)}</b><span class="muted" style="font-size:13px">${st.last ? `Last cut ${esc(fmtDate(st.last))}` : "No cuts yet"}${c.notes ? ` · ${esc(c.notes)}` : ""}</span></span>
          <span class="muted num" style="font-size:13px">${st.visits} ${st.visits === 1 ? "cut" : "cuts"}</span>
        </button>`).join("") : `<div class="empty">${S.clients.size ? "No one matches that search." : "Your client book is empty. Clients are added when you book them in, or tap + Client."}</div>`}
    </section>`;
}

// ---------- Takings ----------
function weekStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); const day = (x.getDay() + 6) % 7; return addDays(x, -day); }
function renderTakings() {
  const gate = dataGate();
  const done = [...S.bookings.values()].filter(b => b.status === "done");
  const now = new Date();
  const ws = ymd(weekStart(now)), we = ymd(addDays(weekStart(now), 7));
  const ms = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-01`;
  const ys = `${now.getFullYear()}-01-01`;
  const sum = arr => arr.reduce((s, b) => s + amount(b), 0);
  const wk = done.filter(b => b.date >= ws && b.date < we);
  const mo = done.filter(b => b.date >= ms);
  const yr = done.filter(b => b.date >= ys);
  const tips = mo.reduce((s, b) => s + Number(b.tip || 0), 0);
  const noshowMo = [...S.bookings.values()].filter(b => b.status === "noshow" && b.date >= ms).length;
  const weeks = [];
  for (let i = 7; i >= 0; i--) { const s = addDays(weekStart(now), -7 * i); const e = addDays(s, 7); const v = sum(done.filter(b => b.date >= ymd(s) && b.date < ymd(e))); weeks.push({ s, v, cur: i === 0 }); }
  const max = Math.max(1, ...weeks.map(w => w.v));
  const months = {};
  done.forEach(b => { const k = b.date.slice(0, 7); (months[k] ||= { v: 0, n: 0 }); months[k].v += amount(b); months[k].n++; });
  const mk = Object.keys(months).sort().reverse();
  return `
    ${gate}
    <div class="tiles">
      <div class="panel tile"><div class="eyebrow">This week</div><div class="v">${money(sum(wk))}</div><div class="s">${wk.length} ${wk.length === 1 ? "cut" : "cuts"}</div></div>
      <div class="panel tile"><div class="eyebrow">${MON_LONG[now.getMonth()]}</div><div class="v">${money(sum(mo))}</div><div class="s">${mo.length} cuts · ${money(tips)} tips</div></div>
      <div class="panel tile"><div class="eyebrow">${now.getFullYear()} so far</div><div class="v">${money(sum(yr))}</div><div class="s">${noshowMo} ${noshowMo === 1 ? "no-show" : "no-shows"} this month</div></div>
    </div>
    <section class="panel chart" aria-label="Takings by week">
      <div class="spread"><span class="eyebrow">Takings by week, last 8 weeks</span><span class="muted" style="font-size:12.5px">Paid cuts and tips</span></div>
      <div class="bars">${weeks.map(w => `<div class="bar${w.cur ? " cur" : ""}"><span class="lbl">${w.v ? money(w.v) : ""}</span><div class="fill" style="height:${Math.round((w.v / max) * 82)}%"></div></div>`).join("")}</div>
      <div class="xl">${weeks.map(w => `<span>${w.s.getDate()} ${MON[w.s.getMonth()]}</span>`).join("")}</div>
    </section>
    <section class="panel">
      <table class="months"><thead><tr><th>Month</th><th>Cuts</th><th>Takings</th></tr></thead>
      <tbody>${mk.length ? mk.map(k => { const [y, m] = k.split("-").map(Number); return `<tr><td>${MON_LONG[m - 1]} ${y}</td><td>${months[k].n}</td><td>${money(months[k].v)}</td></tr>`; }).join("") : `<tr><td colspan="3" class="muted">Takings show here once you mark cuts as done.</td></tr>`}</tbody></table>
    </section>`;
}

function renderBook() {
  const cv = S.cv;
  const ownerNote = S.owner ? `<div class="notice"><b>This is what clients see.</b> Share this page from the Share menu (public link) and put the link in your Instagram bio. Requests come to you by WhatsApp or text, then you add them to your diary.${MARSH_PHONE ? "" : " Your number isn't set yet, so clients get a copy button instead of WhatsApp and text buttons."}</div>` : "";
  const dates = upcomingSlotDates(28);
  let n = 0;
  const step = (title, body) => `<section class="panel step"><h3><span class="n">${++n}</span>${title}</h3>${body}</section>`;
  const isCut = cv.service !== "colour";
  let steps = step("Where would you like your cut?", `<div class="choices two">
      <button class="choice big" data-action="cv-where" data-mode="visit" aria-pressed="${cv.mode === "visit"}">Home visit<small>Marshall comes to you · from £35</small></button>
      <button class="choice big" data-action="cv-where" data-mode="home" aria-pressed="${cv.mode === "home"}">Studio cut<small>At the Urmston studio · from £25</small></button>
    </div>`);
  steps += step("Choose a service", `<div class="choices">
      <button class="choice" data-action="cv-svc" data-service="trim" aria-pressed="${cv.service === "trim"}">Haircut<small>${cv.mode === "visit" ? "from £35" : "£25"} · about 50 min</small></button>
      <button class="choice" data-action="cv-svc" data-service="hairbeard" aria-pressed="${cv.service === "hairbeard"}">Hair & beard<small>${cv.mode === "visit" ? "from £35" : "£35"} · about 1 hr 15</small></button>
      ${cv.mode === "visit" ? `<button class="choice" data-action="cv-svc" data-service="colour" aria-pressed="${cv.service === "colour"}">Dye & colour<small>from £90 · 4 hours+</small></button>` : ""}
    </div>`);
  if (isCut) steps += step("Choose your style", `<div class="choices">${STYLES.map(([k, l]) => `<button class="choice" data-action="cv-style" data-style="${k}" aria-pressed="${cv.style === k}">${l}${k === "refresh" ? `<small>+£5 · full restyle</small>` : ""}</button>`).join("")}</div>
      ${cv.style === "refresh" ? `<div class="muted" style="font-size:13px">A Refresh is a complete restyle. Marshall looks at your face shape, hair type and how you wear it day to day, then recommends and cuts the style that suits you best. Adds £5.</div>` : `<div class="muted" style="font-size:13px">Not sure what to go for? Pick Refresh and Marshall will advise.</div>`}`);
  if (cv.mode === "home") {
    steps += step("Pick a day", `<div class="choices">${dates.map(d => `<button class="choice" data-action="cv-date" data-date="${d}" aria-pressed="${cv.date === d}">${esc(fmtDate(d))}</button>`).join("")}<span class="choice soon" aria-disabled="true">Wednesdays<small>Coming soon</small></span></div>`);
    steps += step("Pick a time", `<div class="choices">${(cv.service === "colour" ? SLOT_TIMES.slice(0, 1) : SLOT_TIMES).map(t => `<button class="choice num" data-action="cv-time" data-time="${t}" aria-pressed="${cv.time === t}">${fmtTime(t)}</button>`).join("")}</div>
      <div class="muted" style="font-size:13px">${cv.service === "colour" ? "Colour takes at least 4 hours, so it starts at the first slot of the evening. Marshall will confirm timings." : "Studio cuts run Thursday and Friday evenings."}</div>`);
  } else {
    const vDates = cv.service === "colour" ? upcomingDays(28, [3]) : upcomingDays(14, VISIT_DAYS);
    const vTimes = !cv.vdate ? [] : cv.service === "colour" ? WED_VISIT_TIMES.filter(t => t <= COLOUR_LATEST_START) : visitTimesFor(cv.vdate);
    steps += step("Pick a day", `<div class="choices">${vDates.map(d => `<button class="choice" data-action="cv-vdate" data-date="${d}" aria-pressed="${cv.vdate === d}">${esc(fmtDate(d))}</button>`).join("")}</div>`);
    steps += step("Pick a start time", `${vTimes.length ? `<div class="choices">${vTimes.map(t => `<button class="choice num" data-action="cv-vtime" data-time="${t}" aria-pressed="${cv.vtime === t}">${fmtTime(t)}</button>`).join("")}</div>` : `<div class="muted">Pick a day first to see start times.</div>`}
      <div class="muted" style="font-size:13px">${cv.service === "colour" ? "Colour is done on Wednesdays and takes at least 4 hours, so it starts by 3pm. Marshall confirms the price and timings." : "Wednesdays start between 2 and 6pm. Other days start from 7:30pm, except Thursdays and Fridays. Marshall confirms the exact time around his other visits."}</div>`);
    steps += step("Where are you?", `<div class="field"><label for="cv-area">Address and postcode</label><input id="cv-area" type="text" autocomplete="street-address" placeholder="e.g. 14 Oak Road, M41 5AB" value="${esc(cv.area)}"></div>
      <div class="field"><label for="cv-access">Parking and access</label><textarea id="cv-access" placeholder="e.g. Driveway free, 2nd floor flat, no lift">${esc(cv.access)}</textarea></div>
      <div class="muted" style="font-size:13px">Home visit prices depend on distance, parking and the service. Your address is only used to plan Marshall's route.</div>`);
  }
  const detailsN = n + 1;
  let request = "";
  if (cv.sent) {
    const text = clientRequestText();
    request = `
      <section class="panel request" aria-live="polite">
        <div class="eyebrow">Your request</div>
        <div class="msg" id="cv-msg">${esc(text)}</div>
        <div class="row">
          ${MARSH_PHONE ? `<a class="btn primary" href="${esc(waLink(MARSH_PHONE, text))}" target="_blank" rel="noopener">Send on WhatsApp</a><a class="btn" href="${esc(smsLink(MARSH_PHONE, text))}">Send by text</a>` : ""}
          <button class="btn${MARSH_PHONE ? "" : " primary"}" data-action="cv-copy">Copy message</button>
        </div>
        <div class="muted" style="font-size:13px">${MARSH_PHONE ? `Or send it to <span class="num" style="user-select:all">${esc(MARSH_PHONE)}</span>. ` : "Paste it into a WhatsApp or text to Marshall. "}You're booked once Marshall replies to confirm.</div>
      </section>`;
  }
  return `
    ${ownerNote}
    <div class="slides" id="slides" aria-roledescription="carousel" aria-label="About Marsh Barbers">
      <section class="hero s-room" aria-roledescription="slide" aria-label="1 of 3">
        <div class="tag">Creative Barber</div>
        <img class="mono" alt="Marsh Barbers" src="${MONO}">
        <h2>Book your cut</h2>
        <p>Home cuts across Manchester through the week, and studio cuts in Urmston on Thursday and Friday evenings. Pick what you need and send Marshall your request.</p>
      </section>
      <section class="hero s-work" aria-roledescription="slide" aria-label="2 of 3">
        <div class="tag">Creative Barber</div>
        <img class="mono" alt="" src="${MONO}">
        <h2>Home cuts</h2>
        <p>Barbershop quality without the wait. Marshall offers precision haircuts and professional colour from home, from clean fades and trims to full bleach and dye work, all finished to the same standard as the shop.</p>
      </section>
      <section class="hero s-bleach" aria-roledescription="slide" aria-label="3 of 3">
        <div class="tag">Colour</div>
        <img class="mono" alt="" src="${MONO}">
        <h2>Colour & bleach</h2>
        <p>Platinum, blonde or a full colour change, lifted carefully and toned to finish. Done as a home visit and starting from £90. Allow at least 4 hours depending on the look, with the final price confirmed on consultation.</p>
      </section>
    </div>
    <div class="dots" id="dots" role="group" aria-label="Choose slide">
      <button data-action="slide" data-i="0" aria-label="Slide 1" aria-current="${S.slide === 0}"></button>
      <button data-action="slide" data-i="1" aria-label="Slide 2" aria-current="${S.slide === 1}"></button>
      <button data-action="slide" data-i="2" aria-label="Slide 3" aria-current="${S.slide === 2}"></button>
    </div>
    <section class="panel board" aria-label="Prices">
      <div class="item"><b>Home visit</b><span class="p num">from £35</span><span>Marshall comes to you. Wednesdays from 2pm, other days from 7:30pm (not Thursdays or Fridays). Price depends on distance, parking and the cut</span></div>
      <div class="item"><b>Studio cut</b><span class="p num">£25</span><span>At Marshall's studio in Urmston, Thursday and Friday evenings, about 50 minutes</span></div>
      <div class="item"><b>Hair & beard</b><span class="p num">£35</span><span>Studio cut plus beard shape-up and line-up, about 1 hour 15</span></div>
      <div class="item"><b>Colour & dye</b><span class="p num">from £90</span><span>Bleach, dye and toning, usually done as a home visit. Allow at least 4 hours depending on the look. Final price confirmed on consultation</span></div>
      <div class="item"><b>Refresh</b><span class="p num">+£5</span><span>Add to any cut for a full restyle, with Marshall's advice on the style that suits you</span></div>
    </section>
    ${steps}
    <section class="panel step">
      <h3><span class="n">${detailsN}</span>Your details</h3>
      <div class="grid2">
        <div class="field"><label for="cv-name">Name</label><input id="cv-name" type="text" autocomplete="name" value="${esc(cv.name)}"></div>
        <div class="field"><label for="cv-phone">Mobile number</label><input id="cv-phone" type="tel" autocomplete="tel" value="${esc(cv.phone)}"></div>
      </div>
      <div class="field"><label for="cv-notes">Anything Marshall should know? (optional)</label><input id="cv-notes" type="text" placeholder="${cv.service === "colour" ? "e.g. Platinum blonde, currently dark brown, never bleached" : "e.g. Same as last time, skin fade, #2 on top"}" value="${esc(cv.notes)}"></div>
      <div class="total"><span>${esc(clientSummary(cv))}</span><b class="num">${esc(clientPrice(cv))}</b></div>
      ${cv.error ? `<div class="err">${esc(cv.error)}</div>` : ""}
      <div><button class="btn primary" data-action="cv-submit">Request booking</button></div>
    </section>
    ${request}`;
}
function clientPrice(cv) {
  let from = false, amt;
  if (cv.service === "colour") { from = true; amt = SERVICES.colour.price; }
  else if (cv.mode === "visit") { from = true; amt = VISIT_FROM; }
  else amt = SERVICES[cv.service].price;
  if (cv.service !== "colour" && cv.style === "refresh") amt += REFRESH_EXTRA;
  return (from ? "from " : "") + money(amt);
}
function clientSummary(cv) {
  const where = cv.mode === "visit" ? "Home visit" : "Studio";
  const what = cv.service === "colour" ? "Dye & colour" : cv.service === "hairbeard" ? "Hair & beard" : "Haircut";
  return [where, what, cv.service !== "colour" && cv.style ? styleName(cv.style) : ""].filter(Boolean).join(" · ");
}
function clientRequestText() {
  const cv = S.cv;
  const lines = [];
  const what = cv.service === "colour" ? "colour and dye" : cv.service === "hairbeard" ? "a hair and beard" : "a haircut";
  if (cv.mode === "home") lines.push(`Hi Marshall, can I book ${what} at the studio on ${fmtDateLong(cv.date)} at ${fmtTime(cv.time)}?`);
  else {
    lines.push(`Hi Marshall, can I book a home visit for ${what}?`);
    lines.push(`When: ${fmtDateLong(cv.vdate)} at ${fmtTime(cv.vtime)}`);
    lines.push(`Address: ${cv.area}`);
    if (cv.access) lines.push(`Parking/access: ${cv.access}`);
  }
  if (cv.service !== "colour" && cv.style) lines.push(`Style: ${styleName(cv.style)}${cv.style === "refresh" ? " (full restyle and advice, +£5)" : ""}`);
  lines.push(`Price: ${clientPrice(cv)}`);
  if (cv.notes) lines.push(`Notes: ${cv.notes}`);
  lines.push(`Name: ${cv.name}`);
  lines.push(`Number: ${cv.phone}`);
  return lines.join("\n");
}
function fixColour() {
  const cv = S.cv; if (cv.service !== "colour") return;
  if (cv.vdate && parseYmd(cv.vdate).getDay() !== 3) { cv.vdate = ""; cv.vtime = ""; }
  if (cv.vtime > COLOUR_LATEST_START) cv.vtime = "";
  if (cv.time && cv.time !== SLOT_TIMES[0]) cv.time = null;
}
function readClientForm() {
  const cv = S.cv;
  ["name", "phone", "notes", "area", "access"].forEach(k => { const el = $("#cv-" + k); if (el) cv[k] = el.value.trim(); });
}

function readBookingForm() {

}
// Route planner for home visits: works out the earliest start after the previous visit plus drive time
function planHtml(f) {
  if (!f.date || !f.time) return `<div class="plan muted">Pick a date and time to see how it fits around your other visits.</div>`;
  const selfId = sheetState?.booking?.id;
  const others = [...S.bookings.values()].filter(x => x.date === f.date && x.kind !== "block" && x.id !== selfId && x.status !== "noshow").sort((a, b) => a.time.localeCompare(b.time));
  const start = toMin(f.time), dur = DURATION[f.service] ?? 50, end = start + dur, travel = Number(f.travel ?? TRAVEL_DEFAULT);
  const prev = others.filter(x => toMin(x.time) < start).pop();
  const next = others.find(x => toMin(x.time) >= start);
  const lines = [`<div><b>${fmtTime(f.time)} to ${fmtTime(fromMin(end))}</b> <span class="muted">· ${esc(SERVICES[f.service]?.name || "")}, ${durText(dur)}</span></div>`];
  let warn = "";
  const dow = parseYmd(f.date).getDay();
  if (f.where === "visit" && (dow === 4 || dow === 5)) warn += `<div class="warn">Thursdays and Fridays are home studio days.</div>`;
  else if (f.where === "visit" && !visitTimesFor(f.date).includes(f.time) && f.time < visitTimesFor(f.date)[0]) warn += `<div class="warn">${dow === 3 ? "Wednesday visits start from 2pm." : "Visits on this day start from 7:30pm, after the shop."}</div>`;
  if (prev) {
    const prevEnd = toMin(endTime(prev)), earliest = prevEnd + travel;
    lines.push(`<div class="muted">After ${esc(prev.clientName)}, finishing ${fmtTime(endTime(prev))}${prev.address ? ` at ${esc(prev.address)}` : ""}</div>`);
    if (start < earliest) { const sug = fromMin(Math.ceil(earliest / 5) * 5); warn = `<div class="warn">Too tight: with a ${travel} min drive, the earliest start is ${fmtTime(sug)}. <button class="btn small" data-action="use-time" data-time="${sug}">Use ${fmtTime(sug)}</button></div>`; }
  }
  if (next && end + travel > toMin(next.time)) warn += `<div class="warn">Runs into ${esc(next.clientName)} at ${fmtTime(next.time)}. Leave at least ${travel} min to drive.</div>`;
  const from = prev?.address || HOME_BASE;
  const route = f.address ? `<div class="row"><a class="btn small" href="${esc(mapsLink(from, f.address))}" target="_blank" rel="noopener">Live traffic in Google Maps</a><a class="btn small" href="${esc(wazeLink(f.address))}" target="_blank" rel="noopener">Open in Waze</a></div><div class="muted" style="font-size:12.5px">Drive from ${esc(from)}. Check the live time, then set the drive time above.</div>` : `<div class="muted" style="font-size:12.5px">Add the address to check the drive with live traffic.</div>`;
  return `<div class="plan">${lines.join("")}${warn}${route}</div>`;
}
function refreshPlan() { const el = $("#f-plan"); if (el && sheetState?.mode === "form" && sheetState.where === "visit") el.innerHTML = planHtml({ ...readBookingForm(), where: "visit" }); }
function showFormError(msg) { const e = $("#f-err"); if (e) { e.textContent = msg; e.hidden = false; } }

async function ensureClient(name, phone) {
  const existing = [...S.clients.values()].find(c => c.name.trim().toLowerCase() === name.trim().toLowerCase());
  if (existing) {
    if (phone && !existing.phone) await S.db.collection("clients").doc(existing.id).update({ phone });
    return { id: existing.id, phone: existing.phone || phone };
  }
  const id = rid("c-");
  await S.db.collection("clients").doc(id).set({ name: name.trim(), phone: phone || "", notes: "", createdAt: new Date().toISOString() });
  return { id, phone };
}

async function saveBooking() {
  if (!S.db) return showFormError("Your diary isn't connected. Refresh and try again.");
  const f = readBookingForm(); const where = sheetState.where;
  if (!f.clientName) return showFormError("Add the client's name.");
  if (!f.date || !f.time) return showFormError("Pick a date and time.");
  const prev = sheetState.booking;
  const newId = where === "home" && isSlot(f.date, f.time) ? slotId(f.date, f.time) : (prev && !prev.id.startsWith("s_") ? prev.id : rid("b-"));
  const clash = S.bookings.get(newId);
  if (clash && (!prev || clash.id !== prev.id)) return showFormError(clash.kind === "block" ? "That slot is blocked. Unblock it first." : `That slot is already taken by ${clash.clientName}.`);
  const btn = $('[data-action="save-booking"]'); if (btn) btn.disabled = true;
  try {
    const c = await ensureClient(f.clientName, f.phone);
    const body = { kind: "appt", where, date: f.date, time: f.time, service: f.service, price: f.price, clientId: c.id, clientName: f.clientName, phone: f.phone || c.phone || "", address: where === "visit" ? f.address : "", duration: DURATION[f.service] ?? 50, style: f.style || "", travel: where === "visit" ? f.travel : 0, notes: f.notes, status: prev?.status || "booked", createdAt: prev?.createdAt || new Date().toISOString() };
    if (prev?.paid != null) body.paid = prev.paid;
    if (prev?.tip != null) body.tip = prev.tip;
    await S.db.collection("bookings").doc(newId).set(body);
    if (prev && prev.id !== newId) await S.db.collection("bookings").doc(prev.id).delete();
    closeSheet(); toast(prev ? "Booking updated" : "Booked in");
    if (!prev) openBooking(newId, true);
  } catch (e) { showFormError("Couldn't save that. Check your connection and try again."); if (btn) btn.disabled = false; }
}

function openBooking(id, justBooked) {
  const b = S.bookings.get(id) || (justBooked ? null : null);
  if (!b) { if (justBooked) setTimeout(() => S.bookings.get(id) && openBooking(id), 300); return; }
  sheetState = { mode: "booking", booking: b, confirm: null };
  renderBookingSheet(justBooked);
}

// ---------- Events ----------
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const a = t.dataset.action;
  const coll = () => S.db.collection("bookings");
  try {
    switch (a) {
      case "close-sheet": closeSheet(); break;
      case "close-sheet-bg": if (e.target === t) closeSheet(); break;
      case "range": S.range = t.dataset.range; render(); break;
      case "new-booking": sheetState = { mode: "form", where: t.dataset.where, booking: null }; openSheet(bookingForm(t.dataset.where === "visit" ? { where: "visit", date: upcomingDays(8, [3])[0], time: WED_VISIT_TIMES[0] } : { where: "home" })); break;
      case "f-where": {
        const cur = readBookingForm(); sheetState.where = t.dataset.where;
        const prev = sheetState.booking || {};
        openSheet(bookingForm({ ...prev, ...cur, id: prev.id, where: t.dataset.where, price: t.dataset.where === "visit" ? Math.max(cur.price || 0, VISIT_FROM) : SERVICES[cur.service].price }));
        break;
      }
      case "free-slot": openFreeSlot(t.dataset.date, t.dataset.time); break;
      case "book-slot": { const { date, time } = sheetState; sheetState = { mode: "form", where: "home", booking: null }; openSheet(bookingForm({ where: "home", date, time })); break; }
      case "block-slot": { const { date, time } = sheetState; await coll().doc(slotId(date, time)).set({ kind: "block", date, time, reason: "", createdAt: new Date().toISOString() }); closeSheet(); toast("Slot blocked"); break; }
      case "unblock": await coll().doc(t.dataset.id).delete(); closeSheet(); toast("Slot unblocked"); break;
      case "open-booking": openBooking(t.dataset.id); break;
      case "save-booking": await saveBooking(); break;
      case "edit-booking": { const b = sheetState.booking; sheetState = { mode: "form", where: b.where || "home", booking: b }; openSheet(bookingForm(b)); break; }
      case "ask-done": sheetState.confirm = "done"; renderBookingSheet(); break;
      case "ask-cancel": sheetState.confirm = "cancel"; renderBookingSheet(); break;
      case "confirm-none": sheetState.confirm = null; renderBookingSheet(); break;
      case "confirm-done": { const b = sheetState.booking; await coll().doc(b.id).update({ status: "done", paid: Number($("#d-paid").value || 0), tip: Number($("#d-tip").value || 0) }); closeSheet(); toast("Marked done"); break; }
      case "confirm-cancel": { const b = sheetState.booking; await coll().doc(b.id).delete(); closeSheet(); toast("Booking cancelled"); break; }
      case "mark-noshow": { const b = sheetState.booking; await coll().doc(b.id).update({ status: "noshow" }); closeSheet(); toast("Marked as no-show"); break; }
      case "mark-booked": { const b = sheetState.booking; await coll().doc(b.id).update({ status: "booked" }); closeSheet(); toast("Set back to booked"); break; }
      case "use-time": { const ti = $("#f-time"); if (ti) { ti.value = t.dataset.time; refreshPlan(); } break; }
      case "new-visit-on": sheetState = { mode: "form", where: "visit", booking: null }; openSheet(bookingForm({ where: "visit", date: t.dataset.date, time: visitTimesFor(t.dataset.date)[0] })); break;
      case "copy-msg": { const el = $("#" + t.dataset.target); copyText(el.textContent, el); break; }
      case "copy-reminder": { const b = S.bookings.get(t.dataset.id); if (b) copyText(reminderText(b)); break; }
      case "open-client": openClient(t.dataset.id); break;
      case "new-client": newClient(); break;
      case "create-client": {
        const name = $("#nc-name").value.trim(); if (!name) return showFormError("Add the client's name.");
        if ([...S.clients.values()].some(c => c.name.toLowerCase() === name.toLowerCase())) return showFormError("You already have a client with that name.");
        const id = rid("c-"); await S.db.collection("clients").doc(id).set({ name, phone: $("#nc-phone").value.trim(), notes: $("#nc-notes").value.trim(), createdAt: new Date().toISOString() });
        closeSheet(); toast("Client added"); break;
      }
      case "save-client": {
        const id = sheetState.id; const name = $("#cl-name").value.trim(); if (!name) return;
        await S.db.collection("clients").doc(id).update({ name, phone: $("#cl-phone").value.trim(), notes: $("#cl-notes").value.trim() });
        toast("Saved"); break;
      }
      case "book-client": { const c = S.clients.get(sheetState.id); sheetState = { mode: "form", where: "home", booking: null }; openSheet(bookingForm({ where: "home", clientName: c.name, phone: c.phone, notes: c.notes })); break; }
      case "ask-del-client": $("#cl-del").innerHTML = `<div class="row"><span class="muted" style="font-size:14px">Delete this client for good?</span><button class="btn small danger solid" data-action="del-client">Delete</button></div>`; break;
      case "del-client": await S.db.collection("clients").doc(sheetState.id).delete(); closeSheet(); toast("Client deleted"); break;
      // client booking page
      case "cv-pick": readClientForm(); S.cv.mode = t.dataset.mode; S.cv.service = t.dataset.service; if (S.cv.service === "colour" && S.cv.vdate && parseYmd(S.cv.vdate).getDay() !== 3) { S.cv.vdate = ""; S.cv.vtime = ""; } if (S.cv.service === "colour" && S.cv.vtime > COLOUR_LATEST_START) S.cv.vtime = ""; S.cv.sent = false; S.cv.error = ""; render(); break;
      case "cv-where": readClientForm(); S.cv.mode = t.dataset.mode; if (S.cv.mode === "home" && S.cv.service === "colour") S.cv.service = "trim"; fixColour(); S.cv.sent = false; S.cv.error = ""; render(); break;
      case "cv-svc": readClientForm(); S.cv.service = t.dataset.service; fixColour(); S.cv.sent = false; S.cv.error = ""; render(); break;
      case "cv-style": readClientForm(); S.cv.style = t.dataset.style; S.cv.sent = false; S.cv.error = ""; render(); break;
      case "cv-date": readClientForm(); S.cv.date = t.dataset.date; S.cv.sent = false; S.cv.error = ""; render(); break;
      case "cv-vdate": readClientForm(); S.cv.vdate = t.dataset.date; if (!visitTimesFor(S.cv.vdate).includes(S.cv.vtime)) S.cv.vtime = ""; S.cv.sent = false; S.cv.error = ""; render(); break;
      case "cv-vtime": readClientForm(); S.cv.vtime = t.dataset.time; S.cv.sent = false; S.cv.error = ""; render(); break;
      case "cv-time": readClientForm(); S.cv.time = t.dataset.time; S.cv.sent = false; S.cv.error = ""; render(); break;
      case "cv-submit": {
        readClientForm(); const cv = S.cv; cv.error = "";
        if (cv.service !== "colour" && !cv.style) cv.error = "Choose a style, or pick Refresh if you'd like Marshall's advice.";
        else if (cv.mode === "home" && (!cv.date || !cv.time)) cv.error = "Pick a day and a time.";
        else if (cv.mode === "visit" && (!cv.vdate || !cv.vtime)) cv.error = "Pick a day and a start time.";
        else if (cv.mode === "visit" && !cv.area) cv.error = "Add your address and postcode so Marshall can plan the visit.";
        else if (!cv.name || !cv.phone) cv.error = "Add your name and mobile number.";
        cv.sent = !cv.error; render();
        if (cv.sent) setTimeout(() => $(".request")?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" }), 30);
        break;
      }
      case "slide": { const sl = $("#slides"); const i = Number(t.dataset.i); sl.scrollTo({ left: i * (sl.clientWidth + 12), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); break; }
      case "cv-copy": { const el = $("#cv-msg"); copyText(el.textContent, el); break; }
    }
  } catch (err) {
    console.error(err); toast("Couldn't save that. Try again.");
  }
});

document.addEventListener("input", e => {
  if (["f-date", "f-time", "f-service", "f-address", "f-travel"].includes(e.target.id)) refreshPlan();
  if (e.target.id === "c-search") { S.search = e.target.value; S._focusSearch = true; render(); S._focusSearch = false; }
  if (e.target.id === "f-service" && sheetState?.mode === "form" && sheetState.where === "home") { const p = $("#f-price"); if (p) p.value = SERVICES[e.target.value].price; }
});
document.addEventListener("change", e => {
  if (["f-date", "f-time", "f-service"].includes(e.target.id)) refreshPlan();
  if (e.target.id === "f-service" && sheetState?.mode === "form") { const p = $("#f-price"); if (p) p.value = sheetState.where === "home" || e.target.value === "colour" ? SERVICES[e.target.value].price : VISIT_FROM; }
  if (e.target.id === "f-style") { const p = $("#f-price"); const prev = e.target.dataset.prev || ""; if (p) { let v = Number(p.value || 0); if (prev === "refresh") v -= REFRESH_EXTRA; if (e.target.value === "refresh") v += REFRESH_EXTRA; p.value = v; } e.target.dataset.prev = e.target.value; }
  if (e.target.id === "f-client") { const c = [...S.clients.values()].find(x => x.name.toLowerCase() === e.target.value.trim().toLowerCase()); const p = $("#f-phone"); if (c && p && !p.value) p.value = c.phone || ""; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet-root").innerHTML) closeSheet(); });

// ---------- Boot ----------
render();

</script>
